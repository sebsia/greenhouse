<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Växthuset live</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">

<style>
:root {
  --bg: #fbfcfa;
  --surface: #f1f4ef;
  --fg: #1c2420;
  --muted: #5d6a63;
  --line: #dde3dc;
  --accent: #2f6b4a;
  --warn: #a0442c;
  --ok: #2f6b4a;
  --body: "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121714;
    --surface: #1a211d;
    --fg: #e3e9e4;
    --muted: #9aa8a0;
    --line: #2b352f;
    --accent: #7cc59b;
    --warn: #e48a6f;
    --ok: #7cc59b;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
}

.wrap {
  max-width: 860px;
  margin: 0 auto;
  padding: 32px 16px 48px;
  display: grid;
  gap: 24px;
}

header {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px 16px;
}

h1 {
  margin: 0;
  font-size: 1.75rem;
  font-weight: 600;
}

.status {
  font-size: 0.875rem;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 8px;
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--muted);
}

.dot.live { background: var(--ok); }
.dot.stale { background: var(--warn); }

.banner {
  padding: 12px 14px;
  border: 1px solid var(--warn);
  border-radius: 6px;
  color: var(--warn);
  font-size: 0.9375rem;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

@media (max-width: 680px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 14px 16px;
  display: grid;
  gap: 4px;
  min-width: 0;
}

.card .label {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
}

.card .value {
  font-family: var(--mono);
  font-size: 1.75rem;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.card .sub {
  font-size: 0.8125rem;
  color: var(--muted);
}

.card.alert { border-color: var(--warn); }
.card.alert .value { color: var(--warn); }

.bar {
  height: 6px;
  background: var(--line);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 4px;
}

.bar span {
  display: block;
  height: 100%;
  background: var(--accent);
  width: 0;
  transition: width .4s;
}

section { display: grid; gap: 10px; }

h2 {
  margin: 0;
  font-size: 1.125rem;
  font-weight: 600;
}

.display {
  font-family: var(--mono);
  background: #10140f;
  color: #9fe6a0;
  border-radius: 6px;
  padding: 14px 16px;
  min-height: 3.2em;
  white-space: pre-wrap;
  word-break: break-word;
}

form {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

input[type=text] {
  flex: 1 1 240px;
  min-width: 0;
  font: inherit;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
  color: var(--fg);
}

button {
  font: inherit;
  padding: 9px 16px;
  border-radius: 6px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--bg);
  cursor: pointer;
}

button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.msg {
  font-size: 0.875rem;
  color: var(--muted);
}

@media (prefers-reduced-motion: reduce) {
  .bar span { transition: none; }
}
</style>
</head>

<body>

<div class="wrap">

  <header>
    <h1>Växthuset live</h1>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="status">Ansluter...</span>
    </div>
  </header>

  <div class="banner" id="demo" hidden>
    Firebase kunde inte anslutas. Kontrollera konfigurationen och databasreglerna.
  </div>

  <div class="grid">

    <div class="card" id="c-temp">
      <span class="label">Temperatur</span>
      <span class="value" id="temp">–</span>
      <span class="sub">°C</span>
    </div>

    <div class="card" id="c-hum">
      <span class="label">Luftfuktighet</span>
      <span class="value" id="hum">–</span>
      <span class="sub">% RH</span>
    </div>

    <div class="card" id="c-soil">
      <span class="label">Jordfukt</span>
      <span class="value" id="soil">–</span>
      <div class="bar">
        <span id="soil-bar"></span>
      </div>
    </div>

    <div class="card" id="c-water">
      <span class="label">Vattennivå</span>
      <span class="value" id="water">–</span>
      <span class="sub" id="water-sub">&nbsp;</span>
    </div>

    <div class="card" id="c-light">
      <span class="label">Ljus</span>
      <span class="value" id="light">–</span>
      <span class="sub" id="light-sub">&nbsp;</span>
    </div>

    <div class="card">
      <span class="label">Uptime</span>
      <span class="value" id="uptime">–</span>
      <span class="sub" id="updated">&nbsp;</span>
    </div>

  </div>

  <section>
    <h2>Displaytext</h2>

    <div class="display" id="displaytext">–</div>

    <form id="form">
      <input
        type="text"
        id="newtext"
        maxlength="64"
        placeholder="Ny text till displayen"
        aria-label="Ny displaytext"
      >

      <button type="submit" id="sendButton">
        Skicka till växthuset
      </button>
    </form>

    <div class="msg" id="msg"></div>
  </section>

</div>


<script type="module">

// ==========================================
// FIREBASE SDK
// ==========================================

import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  set
}
from "https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js";


// ==========================================
// FIREBASE CONFIGURATION
// ==========================================

const firebaseConfig = {
  apiKey: "AIzaSyAX6NmdEDHL42Qyw9orJuJYRIsUp8IaNE",
  authDomain: "test-efd30.firebaseapp.com",
  databaseURL: "https://test-efd30-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "test-efd30",
  storageBucket: "test-efd30.firebasestorage.app",
  messagingSenderId: "774630079149",
  appId: "1:774630079149:web:62c5467c208f2806b4a424",
  measurementId: "G-GP9S9R5J8Y"
};


// ==========================================
// INITIALISERING
// ==========================================

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


// ==========================================
// HJÄLPFUNKTIONER
// ==========================================

const $ = id => document.getElementById(id);

const fmt = (v, d = 1) =>
  typeof v === "number"
    ? v.toFixed(d).replace(".", ",")
    : "–";


function uptimeText(s) {

  if (typeof s !== "number") return "–";

  const d = Math.floor(s / 86400);
  const h = Math.floor(s % 86400 / 3600);
  const m = Math.floor(s % 3600 / 60);

  return d > 0
    ? `${d}d ${h}h`
    : h > 0
      ? `${h}h ${m}m`
      : `${m}m ${Math.floor(s % 60)}s`;
}


// ==========================================
// STATUS
// ==========================================

function setStatus(text, cls = "") {
  $("status").textContent = text;
  $("dot").className = "dot " + cls;
}


// ==========================================
// RENDERING
// ==========================================

let lastUpdate = 0;

function render(v) {

  if (!v) return;

  // Temperatur
  $("temp").textContent = fmt(v.temp);

  // Luftfuktighet
  $("hum").textContent = fmt(v.hum, 0);


  // Jordfuktighet
  $("soil").textContent =
    typeof v.jordfukt === "number"
      ? `${Math.round(v.jordfukt)} %`
      : "–";

  const soilValue =
    typeof v.jordfukt === "number" ? v.jordfukt : 0;

  $("soil-bar").style.width =
    `${Math.max(0, Math.min(100, soilValue))}%`;

  $("c-soil").classList.toggle(
    "alert",
    typeof v.jordfukt === "number" && v.jordfukt < 30
  );


  // Vattennivå
  if (typeof v.vattenniv === "boolean") {

    $("water").textContent = v.vattenniv ? "OK" : "Låg";

    $("water-sub").textContent = v.vattenniv
      ? "Tanken har vatten"
      : "Fyll på tanken";

    $("c-water").classList.toggle("alert", !v.vattenniv);

  } else {

    $("water").textContent =
      typeof v.vattenniv === "number"
        ? `${Math.round(v.vattenniv)} %`
        : "–";

    $("water-sub").textContent = "";

    $("c-water").classList.toggle(
      "alert",
      typeof v.vattenniv === "number" && v.vattenniv < 20
    );
  }


  // Växtljus
  $("light").textContent =
    typeof v.isLightOn === "boolean"
      ? (v.isLightOn ? "På" : "Av")
      : "–";

  $("light-sub").textContent = "Växtljus";


  // Uptime
  $("uptime").textContent = uptimeText(v.lightUptime);


  // Displaytext
  $("displaytext").textContent = v.textDisplay || "–";


  // Uppdateringstid
  lastUpdate = Date.now();

  $("updated").textContent =
    "Uppdaterad " + new Date().toLocaleTimeString("sv-SE");
}


// ==========================================
// HÄMTA DATA FRÅN FIREBASE
// ==========================================

// Variablerna ligger direkt i databasens rot.

onValue(
  ref(db),

  snapshot => {

    const data = snapshot.val();

    if (data) {
      render(data);
      setStatus("Live", "live");
      $("demo").hidden = true;
    } else {
      setStatus("Databasen är tom", "stale");
    }

  },

  error => {

    setStatus("Firebase-fel", "stale");

    $("demo").hidden = false;

    console.error("Firebase läsfel:", error);
  }
);


// ==========================================
// ANSLUTNINGSKONTROLL
// ==========================================

onValue(ref(db, ".info/connected"), snapshot => {

  if (!snapshot.val()) {
    setStatus("Ingen anslutning", "stale");
  }

});


// ==========================================
// KONTROLLERA ATT DATA UPPDATERAS
// ==========================================

setInterval(() => {

  if (lastUpdate && Date.now() - lastUpdate > 60000) {
    setStatus("Inga nya värden på över en minut", "stale");
  }

}, 5000);


// ==========================================
// SKICKA DISPLAYTEXT TILL FIREBASE
// ==========================================

$("form").addEventListener("submit", async e => {

  e.preventDefault();

  const text = $("newtext").value.trim();

  if (!text) return;

  const button = $("sendButton");

  button.disabled = true;

  $("msg").textContent = "Skickar...";

  try {

    await set(ref(db, "textDisplay"), text);

    $("msg").textContent = "Texten har skickats!";

    $("newtext").value = "";

  } catch (error) {

    $("msg").textContent =
      "Kunde inte skicka: " + error.message;

    console.error("Firebase skrivfel:", error);

  } finally {

    button.disabled = false;

  }

});

</script>

</body>
</html>
```
