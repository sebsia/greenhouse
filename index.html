<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Växthuset live</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root {
  --bg: #fbfcfa; --surface: #f1f4ef; --fg: #1c2420; --muted: #5d6a63;
  --line: #dde3dc; --accent: #2f6b4a; --warn: #a0442c; --ok: #2f6b4a;
  --body: "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121714; --surface: #1a211d; --fg: #e3e9e4; --muted: #9aa8a0;
    --line: #2b352f; --accent: #7cc59b; --warn: #e48a6f; --ok: #7cc59b; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 860px; margin: 0 auto; padding: 32px 16px 48px; display: grid; gap: 24px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 16px; }
h1 { margin: 0; font-size: 1.75rem; font-weight: 600; }
.status { font-size: 0.875rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.dot.live { background: var(--ok); }
.dot.stale { background: var(--warn); }
.banner { padding: 12px 14px; border: 1px solid var(--warn); border-radius: 6px; color: var(--warn); font-size: 0.9375rem; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 680px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: grid; gap: 4px; min-width: 0; }
.card .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.card .value { font-family: var(--mono); font-size: 1.75rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.card .sub { font-size: 0.8125rem; color: var(--muted); }
.card.alert { border-color: var(--warn); }
.card.alert .value { color: var(--warn); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.bar span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
section { display: grid; gap: 10px; }
h2 { margin: 0; font-size: 1.125rem; font-weight: 600; }
.display { font-family: var(--mono); background: #10140f; color: #9fe6a0; border-radius: 6px; padding: 14px 16px; min-height: 3.2em; white-space: pre-wrap; word-break: break-word; }
form { display: flex; flex-wrap: wrap; gap: 8px; }
input[type=text] { flex: 1 1 240px; min-width: 0; font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
button { font: inherit; padding: 9px 16px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--bg); cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.msg { font-size: 0.875rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Växthuset live</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Ansluter…</span></div>
  </header>

  <div class="banner" id="demo" hidden>Firebase är inte inställt än, så sidan visar exempelvärden. Klistra in din firebaseConfig längst ned i filen.</div>

  <div class="grid">
    <div class="card" id="c-temp"><span class="label">Temperatur</span><span class="value" id="temp">–</span><span class="sub">°C</span></div>
    <div class="card" id="c-hum"><span class="label">Luftfuktighet</span><span class="value" id="hum">–</span><span class="sub">% RH</span></div>
    <div class="card" id="c-soil"><span class="label">Jordfukt</span><span class="value" id="soil">–</span><div class="bar"><span id="soil-bar"></span></div></div>
    <div class="card" id="c-water"><span class="label">Vattennivå</span><span class="value" id="water">–</span><span class="sub" id="water-sub">&nbsp;</span></div>
    <div class="card" id="c-light"><span class="label">Ljus</span><span class="value" id="light">–</span><span class="sub" id="light-sub">&nbsp;</span></div>
    <div class="card"><span class="label">Uptime</span><span class="value" id="uptime">–</span><span class="sub" id="updated">&nbsp;</span></div>
  </div>

  <section>
    <h2>Displaytext</h2>
    <div class="display" id="displaytext">–</div>
    <form id="form">
      <input type="text" id="newtext" maxlength="64" placeholder="Ny text till displayen" aria-label="Ny displaytext">
      <button type="submit">Skicka till växthuset</button>
    </form>
    <div class="msg" id="msg"></div>
  </section>
</div>

<script type="module">
// 1. Klistra in din config från Firebase-konsolen (Projektinställningar > Dina appar > Webbapp).
const firebaseConfig = {
  apiKey: "",
  authDomain: "",
  databaseURL: "",   // t.ex. https://ditt-projekt-default-rtdb.europe-west1.firebasedatabase.app
  projectId: "",
  appId: ""
};
// 2. Sökvägen i databasen där ESP8266 skriver.
const PATH = "vaxthus";

const $ = id => document.getElementById(id);
const fmt = (v, d = 1) => (typeof v === "number" ? v.toFixed(d).replace(".", ",") : "–");

function uptimeText(s) {
  if (typeof s !== "number") return "–";
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d > 0 ? `${d}d ${h}h` : h > 0 ? `${h}h ${m}m` : `${m}m ${Math.floor(s % 60)}s`;
}

let lastUpdate = 0;
function render(v) {
  if (!v) return;
  $("temp").textContent = fmt(v.temperatur);
  $("hum").textContent = fmt(v.luftfuktighet, 0);

  $("soil").textContent = typeof v.jordfukt === "number" ? `${Math.round(v.jordfukt)} %` : "–";
  $("soil-bar").style.width = `${Math.max(0, Math.min(100, v.jordfukt ?? 0))}%`;
  $("c-soil").classList.toggle("alert", v.jordfukt < 30);

  // vattennivå: true/false (nivåsensor) eller procent
  if (typeof v.vattenniva === "boolean") {
    $("water").textContent = v.vattenniva ? "OK" : "Låg";
    $("water-sub").textContent = v.vattenniva ? "Tanken har vatten" : "Fyll på tanken";
    $("c-water").classList.toggle("alert", !v.vattenniva);
  } else {
    $("water").textContent = typeof v.vattenniva === "number" ? `${Math.round(v.vattenniva)} %` : "–";
    $("water-sub").textContent = "";
    $("c-water").classList.toggle("alert", v.vattenniva < 20);
  }

  // ljus: true/false (växtljus på/av) eller procent
  if (typeof v.ljus === "boolean") {
    $("light").textContent = v.ljus ? "På" : "Av";
    $("light-sub").textContent = "Växtljus";
  } else {
    $("light").textContent = typeof v.ljus === "number" ? `${Math.round(v.ljus)} %` : "–";
    $("light-sub").textContent = "Ljusstyrka";
  }

  $("uptime").textContent = uptimeText(v.uptime);
  $("displaytext").textContent = v.displaytext || "–";
  lastUpdate = Date.now();
  $("updated").textContent = "Uppdaterad " + new Date().toLocaleTimeString("sv-SE");
}

function setStatus(text, cls) {
  $("status").textContent = text;
  $("dot").className = "dot " + (cls || "");
}

if (!firebaseConfig.databaseURL) {
  $("demo").hidden = false;
  setStatus("Exempelvärden", "");
  render({ temperatur: 24.3, luftfuktighet: 68, jordfukt: 42, vattenniva: true, ljus: true, uptime: 13580, displaytext: "Hej från växthuset!" });
  $("form").addEventListener("submit", e => { e.preventDefault(); $("msg").textContent = "Ställ in Firebase först."; });
} else {
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const { getDatabase, ref, onValue, set } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
  const db = getDatabase(initializeApp(firebaseConfig));
  onValue(ref(db, PATH), snap => { render(snap.val()); setStatus("Live", "live"); },
    err => setStatus("Fel: " + err.message, "stale"));
  onValue(ref(db, ".info/connected"), s => { if (!s.val()) setStatus("Ingen anslutning", "stale"); });

  // ESP8266 skickar var 10:e sekund; inget nytt på 60 s betyder att den troligen är offline
  setInterval(() => { if (lastUpdate && Date.now() - lastUpdate > 60000) setStatus("Inga nya värden på över en minut", "stale"); }, 5000);

  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    const text = $("newtext").value.trim();
    if (!text) return;
    try {
      await set(ref(db, PATH + "/displaytext"), text);
      $("msg").textContent = "Skickat. Displayen uppdateras vid nästa avläsning.";
      $("newtext").value = "";
    } catch (err) {
      $("msg").textContent = "Kunde inte skicka: " + err.message + ". Kontrollera databasens regler.";
    }
  });
}
</script>
</body>
</html>
